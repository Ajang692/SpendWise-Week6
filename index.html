
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise - Interactive Budget</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>SpendWise</h1>
            <p>Interactive Budgeting Application</p>
        </header>

        <section class="budget-section">
            <h2>Set Your Budget</h2>

            <input
                type="number"
                id="budgetInput"
                placeholder="Enter your budget"
            >

            <button id="setBudgetBtn">Set Budget</button>
        </section>

        <section class="expense-section">
            <h2>Add an Expense</h2>

            <input
                type="text"
                id="expenseName"
                placeholder="Expense name"
            >

            <input
                type="number"
                id="expenseAmount"
                placeholder="Amount"
            >

            <button id="addExpenseBtn">Add Expense</button>
        </section>

        <section class="dashboard">
            <h2>Budget Dashboard</h2>

            <div class="cards">
                <div class="card">
                    <h3>Budget</h3>
                    <p id="budgetDisplay">KSh 0</p>
                </div>

                <div class="card">
                    <h3>Total Expenses</h3>
                    <p id="expenseDisplay">KSh 0</p>
                </div>

                <div class="card">
                    <h3>Remaining Balance</h3>
                    <p id="balanceDisplay">KSh 0</p>
                </div>
            </div>

            <div class="message">
                <p id="budgetMessage">Set your budget to begin.</p>
            </div>
        </section>

        <section class="expenses">
            <h2>Expense Records</h2>

            <ul id="expenseList">
                <li>No expenses added yet.</li>
            </ul>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
